name: AI Investing Pre-Market Brief

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate report
        id: report
        env:
          REPORT_BASE_URL: ${{ secrets.REPORT_BASE_URL }}
        run: python scripts/run_daily_report.py

      - name: Update Pre-Market Brief index
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          reports = sorted(
              [f.stem for f in Path("docs/reports").glob("*.html") if f.stem != "index"],
              reverse=True
          )
          items = "\n".join(f'<li><a href="{d}.html">{d}</a></li>' for d in reports)
          html = f"""<!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>AI Investing Pre-Market Brief</title>
          <style>
          body{{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.6;max-width:860px;margin:0 auto;padding:32px 20px;color:#1f2933}}
          h1{{font-size:1.6rem;margin-bottom:6px}}
          p.sub{{color:#5b6472;margin:0 0 24px;font-size:.95rem}}
          ul{{list-style:none;padding:0;margin:0}}
          li{{border-bottom:1px solid #e8ecf0;padding:10px 0}}
          li:last-child{{border-bottom:none}}
          a{{color:#0055cc;text-decoration:none;font-weight:500}}
          a:hover{{text-decoration:underline}}
          </style>
          </head>
          <body>
          <h1>AI Investing Pre-Market Brief</h1>
          <p class="sub">Research-only. No buy/sell instructions. No trading automation.</p>
          <ul>
          {items}
          </ul>
          </body>
          </html>"""
          Path("docs/reports/index.html").write_text(html, encoding="utf-8")
          print(f"Index updated with {len(reports)} reports.")
          EOF

      - name: Commit generated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports docs
          git diff --cached --quiet || git commit -m "Add AI investing pre-market brief"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            git push && break
            echo "push attempt $attempt failed (concurrent push); retrying..."
            sleep $((RANDOM % 5 + 2))
          done

      - name: Create or update GitHub issue notification
        uses: actions/github-script@v7
        with:
          script: |
            const title = `AI Investing Pre-Market Brief - ${{ steps.report.outputs.date }}`;
            const reportUrl = `${{ steps.report.outputs.report_url }}`;
            const handoffPath = `${{ steps.report.outputs.handoff_path }}`;
            const statusSummary = `${{ steps.report.outputs.status_summary }}`;
            const body = [
              `AI Investing Pre-Market Brief for ${{ steps.report.outputs.date }} is ready.`,
              ``,
              `HTML report: ${reportUrl}`,
              `ChatGPT handoff: ${handoffPath}`,
              ``,
              `Status: ${statusSummary}`,
              ``,
              `Research-only disclaimer: This report is for research only. It does not contain buy/sell instructions and does not execute trades.`
            ].join("\n");

            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "all",
              per_page: 100
            });
            const issue = existing.data.find(item => item.title === title && !item.pull_request);
            if (issue) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                body,
                state: "open"
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body
              });
            }

      - name: Send SMTP email notification
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          REPORT_BASE_URL: ${{ secrets.REPORT_BASE_URL }}
        run: python scripts/send_email.py
